<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2do Encuentro Internacional de Estadística · Taller y Ponencia · FastAnalytics</title>
<style>
  :root{ --teal:#006D6D; --teal3:#0D9488; --amber:#D4883A; --amber2:#B45309; --line:#E2E8F0; --txt:#0F172A; --mut:#64748B; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px;gap:34px}
  #langBtn{position:fixed;top:16px;right:16px;z-index:10;background:#fff;border:1.5px solid var(--teal);
    color:var(--teal);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:800;cursor:pointer;
    font-family:inherit;transition:.15s}
  #langBtn:hover{background:var(--teal);color:#fff}
  .brandrow{display:flex;align-items:center;justify-content:center;gap:44px;flex-wrap:wrap;
    padding:0 12px 26px 12px;border-bottom:1px solid var(--line);max-width:980px;width:100%}
  .brandrow svg,.brandrow img{height:52px;width:auto}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;max-width:980px}
  @media (max-width:840px){.choice{grid-template-columns:1fr}}
  .chcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 32px;
    display:flex;flex-direction:column;gap:13px;text-decoration:none;color:inherit;
    box-shadow:0 1px 3px rgba(15,23,42,.06);transition:.18s}
  .chcard:hover{transform:translateY(-4px);border-color:var(--teal3);box-shadow:0 12px 28px rgba(0,109,109,.14)}
  .chcard.taller{border-top:4px solid var(--teal3)}
  .chcard.ponencia{border-top:4px solid var(--amber)}
  .chk{font-size:11px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--teal3)}
  h1{font-size:22px;font-weight:800;color:var(--txt);line-height:1.3}
  .chd{font-size:14px;color:var(--mut);line-height:1.6;flex:1}
  .chgo{font-size:14px;font-weight:800;color:var(--teal)}
  .chcard:hover .chgo{color:var(--amber2)}
</style>
</head>
<body>
  <button id="langBtn" type="button">EN</button>

  <div class="brandrow">
    <img src="logo-fastanalytics-lema.png" alt="FastAnalytics" style="height:60px;width:auto">
    <img src="logo-2wie.svg" alt="2do Encuentro Internacional de Estadística">
    <img src="logo-unal.svg" alt="Universidad Nacional de Colombia">
  </div>
  <p style="margin:-22px 0 0 0;font-size:13px;color:var(--mut);text-align:center;max-width:980px">
    <strong style="color:var(--teal)" data-es="FastAnalytics S.A.S" data-en="FastAnalytics S.A.S"></strong><span data-es=" · Patrocinador oficial del " data-en=" · Official sponsor of the "></span>
    <strong data-es="2do Encuentro Internacional de Estadística 2026" data-en="2nd International Meeting on Statistics 2026"></strong>
  </p>

  <div class="choice">
    <a class="chcard taller" href="./taller/">
      <div class="chk" data-es="Taller · Pre-workshop" data-en="Workshop · Pre-workshop"></div>
      <h1 data-es="Modelado de redes criminales e inteligencia financiera" data-en="Modeling Criminal Networks and Financial Intelligence"></h1>
      <p class="chd" data-es="Animaciones 3D del Chronnet Show y material Quarto bilingüe (ES · EN) · 6 módulos con el dataset FinCEN/ICIJ · pre-workshop virtual del 4 de noviembre."
         data-en="Chronnet Show 3D animations and bilingual Quarto material (ES · EN) · 6 modules on the FinCEN/ICIJ dataset · virtual pre-workshop on November 4."></p>
      <span class="chgo" data-es="Abrir el taller ↗" data-en="Open the workshop ↗"></span>
    </a>
    <a class="chcard ponencia" id="cardPonencia" href="./ponencia/">
      <div class="chk" data-es="Ponencia · 2WIE 2026" data-en="Talk · 2WIE 2026"></div>
      <h1 data-es="Reconstrucción de redes criminales espaciotemporales para su disrupción en la Amazonía" data-en="Reconstructing spatio-temporal criminal networks for disruption in the Amazon"></h1>
      <p class="chd" data-es="Presentación científica · 5 y 6 de noviembre · Universidad Nacional de Colombia, Sede Manizales · página Quarto con pestañas y descarga del PDF en español e inglés (43 diapositivas)."
         data-en="Scientific talk · November 5–6 · Universidad Nacional de Colombia, Manizales campus · tabbed Quarto page with the PDF download in Spanish and English (43 slides)."></p>
      <span class="chgo" data-es="Ver la ponencia ↗" data-en="View the talk ↗"></span>
    </a>
  </div>

<script>
(function(){
  var btn = document.getElementById('langBtn');
  var cardP = document.getElementById('cardPonencia');
  function setLang(lang){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-es]').forEach(function(el){
      el.textContent = el.dataset[lang];
    });
    cardP.href = (lang === 'en') ? './ponencia/en/' : './ponencia/';
    btn.textContent = (lang === 'es') ? 'EN' : 'ES';
    localStorage.setItem('ee-lang', lang);
  }
  btn.addEventListener('click', function(){
    setLang(document.documentElement.lang === 'es' ? 'en' : 'es');
  });
  setLang(localStorage.getItem('ee-lang') === 'en' ? 'en' : 'es');
})();
</script>
</body>
</html>
