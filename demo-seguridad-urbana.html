dialog::backdrop{background:rgba(8,12,20,.85);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){

<main class="pt-20 sm:pt-24 pb-16 px-4 sm:px-6">

    <div class="rounded-2xl overflow-hidden border border-white/10" style="box-shadow:0 0 60px rgba(0,109,109,.15),0 20px 60px rgba(0,0,0,.5)">
      <video class="w-full aspect-video bg-black" src="assets/demo/video-ecosistema-sdr.mp4" poster="assets/demo/hook-poster.jpg" controls playsinline preload="metadata" width="1280" height="720" aria-label="Video institucional del ecosistema FastAnalytics de seguridad urbana"></video>

  <section aria-labelledby="elija" class="max-w-6xl mx-auto mt-12 sm:mt-16">

<dialog id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="fixed inset-0 flex items-center justify-center p-4">
    <div class="relative w-full max-w-3xl rounded-2xl border border-white/10 bg-[#0B111C] p-3 sm:p-4" style="box-shadow:0 24px 80px rgba(0,0,0,.6)">
      <div class="flex items-center justify-between gap-3 px-1 pb-3">
        <h2 id="modal-title" class="text-sm sm:text-base font-extrabold tracking-[.15em] text-white"></h2>
        <button type="button" id="modal-close" class="flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-slate-300 transition hover:text-white hover:brightness-125" style="border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <video id="modal-video" class="w-full aspect-video rounded-xl bg-black" controls playsinline preload="metadata"></video>
    </div>
  </div>
</dialog>

<script>
(function(){
  var modal=document.getElementById('modal');
  var modalVideo=document.getElementById('modal-video');
  var modalTitle=document.getElementById('modal-title');
  var closeBtn=document.getElementById('modal-close');
  var lastTrigger=null;

  function openModal(trigger){
    lastTrigger=trigger;
    modalTitle.textContent=trigger.dataset.title;
    modalVideo.src=trigger.dataset.video;
    modal.showModal();
    closeBtn.focus();
  }
  function closeModal(){
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.load();
    modal.close();
    if(lastTrigger){lastTrigger.focus();lastTrigger=null;}
  }

  document.querySelectorAll('[data-video]').forEach(function(btn){
    btn.addEventListener('click',function(){openModal(btn);});
  });
  closeBtn.addEventListener('click',closeModal);
  modal.addEventListener('cancel',function(){
    modalVideo.pause();
    modalVideo.removeAttribute('src');
    modalVideo.load();
    if(lastTrigger){lastTrigger.focus();lastTrigger=null;}
  });
  modal.addEventListener('click',function(e){
    if(e.target===modal){closeModal();}
  });
})();
</script>

</body>
