<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img" aria-labelledby="mathdecision-title">
  <title id="mathdecision-title">MathDecision — Grupo de investigación</title>

  <!-- Icono: eneágono de FastAnalytics con la notación de función f(x) -->
  <g>
    <!-- Eneágono exterior -->
    <polygon
      points="68,28 101.4,40.2 119.2,71 113,106 85.8,128.8 50.2,128.8 23,106 16.8,71 34.6,40.2"
      fill="none" stroke="#006D6D" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Líneas internas sutiles (red) -->
    <g stroke="#006D6D" stroke-width="0.5" opacity="0.12">
      <line x1="68" y1="28" x2="85.8" y2="128.8"/>
      <line x1="101.4" y1="40.2" x2="23" y2="106"/>
      <line x1="119.2" y1="71" x2="50.2" y2="128.8"/>
      <line x1="113" y1="106" x2="34.6" y2="40.2"/>
      <line x1="16.8" y1="71" x2="101.4" y2="40.2"/>
    </g>

    <!-- Nodos de los vértices -->
    <g fill="#006D6D">
      <circle cx="68" cy="28" r="3"/>
      <circle cx="101.4" cy="40.2" r="2.3"/>
      <circle cx="119.2" cy="71" r="3"/>
      <circle cx="113" cy="106" r="2.3"/>
      <circle cx="85.8" cy="128.8" r="3"/>
      <circle cx="50.2" cy="128.8" r="2.3"/>
      <circle cx="23" cy="106" r="3"/>
      <circle cx="16.8" cy="71" r="2.3"/>
      <circle cx="34.6" cy="40.2" r="3"/>
    </g>

    <!-- Notación de función: f(x) -->
    <text x="58" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="62" fill="#D4883A">f</text>
    <text x="94" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#006D6D">(x)</text>
  </g>

  <!-- Nombre del grupo -->
  <text x="152" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#006D6D">Math</tspan><tspan fill="#1A1A2E">Decision</tspan>
  </text>

  <!-- Separador -->
  <line x1="152" y1="106" x2="384" y2="106" stroke="#006D6D" stroke-width="0.75" opacity="0.25"/>

  <!-- Subtítulo -->
  <text x="152" y="128" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#8888A0" letter-spacing="2.6">GRUPO DE INVESTIGACIÓN</text>
</svg>
