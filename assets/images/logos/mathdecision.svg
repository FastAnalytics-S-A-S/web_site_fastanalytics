<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img" aria-labelledby="mathdecision-title">
  <title id="mathdecision-title">MathDecision — Grupo de investigación</title>

  <!-- Icono: árbol de decisión que converge en una única elección estratégica -->
  <g>
    <rect x="8" y="20" width="120" height="120" rx="24" fill="#E0EFEF"/>
    <rect x="8" y="20" width="120" height="120" rx="24" fill="none" stroke="#006D6D" stroke-width="2.5"/>

    <!-- Aristas del árbol -->
    <g stroke="#006D6D" stroke-width="2.5" stroke-linecap="round">
      <line x1="38" y1="112" x2="53" y2="84"/>
      <line x1="68" y1="112" x2="53" y2="84"/>
      <line x1="68" y1="112" x2="83" y2="84"/>
      <line x1="98" y1="112" x2="83" y2="84"/>
      <line x1="53" y1="84" x2="68" y2="58"/>
      <line x1="83" y1="84" x2="68" y2="58"/>
    </g>

    <!-- Nodos base e intermedios -->
    <g fill="#006D6D">
      <circle cx="38" cy="112" r="6.5"/>
      <circle cx="68" cy="112" r="6.5"/>
      <circle cx="98" cy="112" r="6.5"/>
      <circle cx="53" cy="84" r="6.5"/>
      <circle cx="83" cy="84" r="6.5"/>
    </g>

    <!-- Nodo decisor (diamante) -->
    <rect x="60.5" y="40.5" width="15" height="15" transform="rotate(45 68 48)" fill="#D4883A"/>
  </g>

  <!-- Nombre del grupo -->
  <text x="152" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#006D6D">Math</tspan><tspan fill="#1A1A2E">Decision</tspan>
  </text>

  <!-- Separador -->
  <line x1="152" y1="106" x2="384" y2="106" stroke="#006D6D" stroke-width="0.75" opacity="0.25"/>

  <!-- Subtítulo -->
  <text x="152" y="128" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#8888A0" letter-spacing="2.6">GRUPO DE INVESTIGACIÓN</text>
</svg>
